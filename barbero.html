<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel del barbero · FMK Barbershop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="nav">
    <div class="nav__interior">
      <a class="marca" href="barbero.html">
        <img src="assets/logo.png" alt="FMK Barbershop">
      </a>
      <div class="nav__links">
        <span class="nav__usuario">Hola, <span id="nombre-usuario"></span></span>
        <button class="nav__link activo" id="nav-turnos">Mis turnos</button>
        <button class="nav__link" id="nav-horarios">Mis horarios</button>
        <button class="nav__link" id="nav-buscar">Buscar cliente</button>
        <button class="nav__link" id="nav-tienda">Tienda</button>
        <button class="nav__link" id="nav-caja">Caja</button>
        <button class="nav__link nav__salir" id="btn-salir">Cerrar sesión</button>
      </div>
    </div>
  </nav>

  <main class="envoltorio">

    <!-- TURNOS -->
    <section id="seccion-turnos">
      <div class="panel">
        <div class="panel__cabecera">
          <h2>Turnos reservados</h2>
        </div>
        <div id="lista-turnos"></div>
      </div>
    </section>

    <!-- HORARIOS -->
    <section id="seccion-horarios" class="oculto">
      <div class="panel">
        <div class="panel__cabecera"><h2>Generar horarios automáticamente</h2></div>
        <form id="form-masivo">
          <div id="mensaje-masivo" class="mensaje"></div>
          <div class="fila-campos">
            <div class="campo">
              <label for="masivo-desde">Desde</label>
              <input type="date" id="masivo-desde" required>
            </div>
            <div class="campo">
              <label for="masivo-hasta">Hasta</label>
              <input type="date" id="masivo-hasta" required>
            </div>
          </div>

          <div class="campo">
            <label>Días de la semana</label>
            <div class="servicios-grilla dias-grilla">
              <label class="campo-check"><input type="checkbox" name="dia-semana" value="1" checked> Lun</label>
              <label class="campo-check"><input type="checkbox" name="dia-semana" value="2" checked> Mar</label>
              <label class="campo-check"><input type="checkbox" name="dia-semana" value="3" checked> Mié</label>
              <label class="campo-check"><input type="checkbox" name="dia-semana" value="4" checked> Jue</label>
              <label class="campo-check"><input type="checkbox" name="dia-semana" value="5" checked> Vie</label>
              <label class="campo-check"><input type="checkbox" name="dia-semana" value="6" checked> Sáb</label>
              <label class="campo-check"><input type="checkbox" name="dia-semana" value="0"> Dom</label>
            </div>
          </div>

          <div class="fila-campos">
            <div class="campo">
              <label for="masivo-apertura">Apertura</label>
              <input type="time" id="masivo-apertura" value="10:00" required>
            </div>
            <div class="campo">
              <label for="masivo-cierre">Cierre</label>
              <input type="time" id="masivo-cierre" value="20:00" required>
            </div>
            <div class="campo">
              <label for="masivo-intervalo">Cada cuántos minutos</label>
              <select id="masivo-intervalo">
                <option value="15">15 minutos</option>
                <option value="20">20 minutos</option>
                <option value="30" selected>30 minutos</option>
                <option value="40">40 minutos</option>
                <option value="45">45 minutos</option>
                <option value="60">60 minutos</option>
              </select>
            </div>
          </div>

          <p id="masivo-resumen" class="texto-tenue"></p>
          <button type="submit" class="btn btn--violeta" id="btn-masivo">Generar horarios</button>
        </form>
      </div>

      <div class="panel">
        <div class="panel__cabecera"><h2>Cargar un horario suelto</h2></div>
        <form id="form-horario">
          <div id="mensaje-horario" class="mensaje"></div>
          <div class="fila-campos">
            <div class="campo">
              <label for="horario-fecha">Fecha</label>
              <input type="date" id="horario-fecha" required>
            </div>
            <div class="campo">
              <label for="horario-hora">Hora</label>
              <input type="time" id="horario-hora" required>
            </div>
          </div>
          <button type="submit" class="btn btn--violeta">Agregar horario</button>
        </form>
      </div>

      <div class="panel">
        <div class="panel__cabecera"><h2>Mis horarios cargados</h2></div>
        <div id="lista-horarios"></div>
        <div id="paginacion-horarios" class="paginacion"></div>
      </div>
    </section>

    <!-- BUSCAR CLIENTE -->
    <section id="seccion-buscar" class="oculto">
      <div class="panel">
        <div class="panel__cabecera"><h2>Buscar cliente</h2></div>
        <form id="form-buscar">
          <div class="fila-campos" style="align-items:end;">
            <div class="campo">
              <label for="buscar-input">DNI o usuario del cliente</label>
              <input type="text" id="buscar-input" required>
            </div>
            <button type="submit" class="btn btn--violeta" style="height:fit-content">Buscar</button>
          </div>
        </form>
        <div id="resultado-buscar"></div>
      </div>
    </section>

    <!-- TIENDA -->
    <section id="seccion-tienda" class="oculto">
      <div class="panel">
        <div class="panel__cabecera"><h2>Agregar producto</h2></div>
        <form id="form-producto">
          <div id="mensaje-producto" class="mensaje"></div>
          <div class="campo">
            <label for="producto-nombre">Nombre</label>
            <input type="text" id="producto-nombre" required>
          </div>
          <div class="campo">
            <label for="producto-descripcion">Descripción</label>
            <textarea id="producto-descripcion" rows="2"></textarea>
          </div>
          <div class="fila-campos">
            <div class="campo">
              <label for="producto-precio">Precio</label>
              <input type="number" step="0.01" min="0" id="producto-precio" required>
            </div>
            <div class="campo">
              <label for="producto-stock">Stock</label>
              <input type="number" min="0" id="producto-stock" value="0">
            </div>
          </div>
          <div class="campo">
            <label for="producto-imagen">URL de imagen (opcional)</label>
            <input type="url" id="producto-imagen" placeholder="https://...">
          </div>
          <button type="submit" class="btn btn--violeta">Guardar producto</button>
        </form>
      </div>

      <div class="panel">
        <div class="panel__cabecera"><h2>Productos de la tienda</h2></div>
        <div id="lista-productos-barbero"></div>
      </div>
    </section>

    <!-- CAJA -->
    <section id="seccion-caja" class="oculto">
      <div class="panel">
        <div class="panel__cabecera"><h2>Resumen de caja</h2></div>
        <div class="caja-resumen" id="caja-resumen"></div>
      </div>

      <div class="panel">
        <div class="panel__cabecera"><h2>Agregar gasto</h2></div>
        <form id="form-gasto">
          <div id="mensaje-gasto" class="mensaje"></div>
          <div class="fila-campos">
            <div class="campo">
              <label for="gasto-monto">Monto</label>
              <input type="number" step="0.01" min="0" id="gasto-monto" required>
            </div>
            <div class="campo">
              <label for="gasto-descripcion">Descripción</label>
              <input type="text" id="gasto-descripcion" placeholder="Ej: shampoo, alquiler, insumos" required>
            </div>
          </div>
          <button type="submit" class="btn btn--peligro">Agregar gasto</button>
        </form>
      </div>

      <div class="panel">
        <div class="panel__cabecera"><h2>Movimientos</h2></div>
        <div id="lista-caja"></div>
        <div id="paginacion-caja" class="paginacion"></div>
      </div>
    </section>

  </main>

  <footer class="footer">
    <div class="footer__interior">
      <div class="footer__marca">
        <img src="assets/logo.png" alt="FMK Barbershop">
        <strong>FMK BARBERSHOP</strong>
      </div>
      <span class="footer__nota">© <span id="anio"></span> FMK Barbershop. Todos los derechos reservados.</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/barbero.js"></script>
  <script>document.getElementById('anio').textContent = new Date().getFullYear();</script>
</body>
</html>
